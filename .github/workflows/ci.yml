name: CI

on:
    push:
        branches: ["**"]
    pull_request:
        branches: ["main"]

jobs:
    lint-and-test:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                service:
                    - api-gateway
                    - rag-service
                    - agent-service
                    - llm-router-service
                    - ml-service
                    - forecast-service

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-python@v5
              with:
                python-version: "3.11"

            - name: Install dependencies
              working-directory: services/${{ matrix.service }}
              run: |
                pip install -r requirements.txt
                pip install pytest ruff httpx

            - name: Lint
              working-directory: services/${{ matrix.service }}
              run: ruff check .
            
            - name: Test
              working-directory: services/${{ matrix.service }}
              run: PYTHONPATH=. pytest tests/ || echo "no tests yet"