services:
  api-gateway:
    build: ../services/api-gateway
    ports:
      - "8000:8000"
    depends_on:
      - rag-service
      - agent-service
      - llm-router-service
      - ml-service
      - forecast-service
    
  rag-service:
    build: ../services/rag-service
    ports:
      - "8001:8000"
    depends_on:
      - qdrant
    
  agent-service:
    build: ../services/agent-service
    ports:
      - "8002:8000"

  llm-router-service:
    build: ../services/llm-router-service
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
    ports:
      - "8003:8000"
    depends_on:
      - ollama

  ml-service:
    build: ../services/ml-service
    ports:
      - "8004:8000"

  forecast-service:
    build: ../services/forecast-service
    ports:
      - "8005:8000"

  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=-1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  qdrant_data:
  ollama_data: