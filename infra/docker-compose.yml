services:
  api-gateway:
    build: ../services/api-gateway
    ports:
      - "8000:8000"
    depends_on:
      - rag-service
      - agent-service
      - llm-router-service
      - ml-service
      - forecast-service
    
  rag-service:
    build: ../services/rag-service
    ports:
      - "8001:8000"
    depends_on:
      - qdrant
    
  agent-service:
    build: ../services/agent-service
    ports:
      - "8002:8000"

  llm-router-service:
    build: ../services/llm-router-service
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
    ports:
      - "8003:8000"
    depends_on:
      - ollama

  ml-service:
    build: ../services/ml-service
    ports:
      - "8004:8000"
    volumes:
      - shared_data:/app/shared_data
      - ../mlops:/mlops
    deploy:
      resources:
        limits:
          cpus: "2"

  forecast-service:
    build: ../services/forecast-service
    ports:
      - "8005:8000"
    volumes:
      - shared_data:/app/shared_data
    deploy:
      resources:
        limits:
          cpus: "2"

  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=-1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  mlflow:
    build: ../mlops/mlflow
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow

  postgres-airflow:
    image: postgres:16
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_DB=airflow
    volumes:
      - postgres_airflow_data:/var/lib/postgresql/data

  airflow-init:
    build: ../orchestration/airflow
    depends_on:
      - postgres-airflow
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres-airflow/airflow
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__WEBSERVER__SECRET_KEY=106fed17d8bf522724fcc1dbedaddd28b5090abaaaed462df884457a09b6ce26
    entrypoint: /bin/bash
    command: -c "airflow db migrate && airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com"

  airflow-webserver:
    build: ../orchestration/airflow
    depends_on:
      - airflow-init
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres-airflow/airflow
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__WEBSERVER__SECRET_KEY=106fed17d8bf522724fcc1dbedaddd28b5090abaaaed462df884457a09b6ce26
    ports:
      - "8080:8080"
    volumes:
      - ../orchestration/airflow/dags:/opt/airflow/dags
      - /var/run/docker.sock:/var/run/docker.sock
    command: webserver

  airflow-scheduler:
    build: ../orchestration/airflow
    depends_on:
      - airflow-init
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres-airflow/airflow
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__WEBSERVER__SECRET_KEY=106fed17d8bf522724fcc1dbedaddd28b5090abaaaed462df884457a09b6ce26
    volumes:
      - ../orchestration/airflow/dags:/opt/airflow/dags
      - /var/run/docker.sock:/var/run/docker.sock
    command: scheduler

volumes:
  qdrant_data:
  ollama_data:
  shared_data:
  mlflow_data:
  postgres_airflow_data: